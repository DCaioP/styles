# Flags extras do Obsidian (lidas por /usr/bin/obsidian, que faz
# `grep -v '^#'` neste arquivo e passa o resultado pro electron).
#
# --ozone-platform=x11 : força XWayland em vez de Wayland nativo.
#
# Motivo (cedilha): no backend Wayland o Chromium/Electron compõe dead keys
# com uma tabela COMPILADA no binário (derivada do compose do GTK) e ignora
# ~/.XCompose e XCOMPOSEFILE por completo — o binário sequer importa os
# símbolos xkb_compose_*. Com o layout us(intl), ' + c vira "ć" (U+0107) em
# vez de "ç" (U+00E7). No backend X11 a composição passa pelo Xlib, que lê
# ~/.XCompose (gerado por dotfiles/gen-xcompose.sh).
#
# Medido com electron39 injetando ' + c via `hyprctl dispatch sendshortcut`:
#   wayland                        -> ć
#   wayland + XCOMPOSEFILE         -> ć
#   wayland + --gtk-version=3      -> ć
#   wayland + --enable-wayland-ime -> nada (Hyprland sem IME não compõe)
#   x11                            -> ç  ✔
#
# Custo: XWayland. Sem perda de nitidez enquanto os monitores estiverem em
# scale=1; se um dia usar escala fracionária, a janela fica borrada.
--ozone-platform=x11
