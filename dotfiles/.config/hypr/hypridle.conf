# --- CONFIGURAÇÃO HYPRIDLE (Modo Sem Dormir) ---

general {
    # Comando de bloqueio (se quiser ativar, tire o # da frente)
    # lock_cmd = pidof hyprlock || hyprlock
    
    # Executa antes de dormir (caso force a suspensão manual)
    before_sleep_cmd = loginctl lock-session
    
    # Ao acordar, liga a tela (para evitar ter que apertar tecla 2x)
    after_sleep_cmd = hyprctl dispatch dpms on
    
    # Ignora inibição de apps como Spotify (opcional)
    ignore_dbus_inhibit = false
}

