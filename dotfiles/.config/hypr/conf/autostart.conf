# -----------------------------------------------------
# Programs
# -----------------------------------------------------
$terminal = warp-terminal
$fileManager = dolphin
$menu = wofi --show drun

# -----------------------------------------------------
# Autostart
# -----------------------------------------------------

# Setup XDG for screen sharing
exec-once = ~/.config/hypr/scripts/xdg.sh

# Start Polkit
exec-once=/usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1

# Load Swaync Notification Manager
exec-once = swaync && swaync-client -df

# Using hypridle to start hyprlock
exec-once = hypridle

# Load Wallpaper System
# Tenta o waypaper --restore; se ele falhar, aplica a config.ini direto via
# mpvpaper, pra uma dependencia quebrada nao deixar a tela sem wallpaper.
# Log do que aconteceu: ~/.cache/waypaper/restore.log
exec-once = ~/.config/hypr/scripts/wallpaper-restore.sh

# Load Waybar to navbarw
exec-once = waybar

# -------------------------------
# Load cliphist history
exec-once = wl-paste --watch cliphist store

# Start ewww daemon
exec-once = ags &

# Spotlight launcher (vicinae) server
exec-once = vicinae server

# Load GTK settings
exec-once = ~/.config/hypr/scripts/gtk.sh
