# ----------------------------------------------------- 
# Window rules
# ----------------------------------------------------- 

windowrule = match:class ^(blueman-manager)$, float on
windowrule = match:class ^(nm-connection-editor)$, float on
windowrule = match:class ^(qalculate-gtk)$, float on
windowrule = match:class ^(Blanket)$, float on
# Browser Picture in Picture
windowrule = match:title ^(Picture-in-Picture)$, float on, pin on, move 69.5% 4%

# Layers Config
# layerrule = blur, wofi
# layerrule = ignorezero, wofi
# layerrule = ignorealpha 0.5, wofi

# Sintaxe nova (Hyprland 0.55+): match:namespace + regra com valor.
# Waybar: frosted glass islands. ignore_alpha 0.20 => os vãos transparentes
# entre as ilhas (alpha 0) não borram; as ilhas (tint base >= 0.24) sim.
# Limiar baixado de 0.3 -> 0.20 porque o tint das ilhas ficou mais translúcido
# (mais wallpaper vívido através do vidro).
layerrule = match:namespace ^(waybar)$, blur on
layerrule = match:namespace ^(waybar)$, ignore_alpha 0.20

# swaync (notificações) com o mesmo tratamento de vidro
layerrule = match:namespace ^(swaync-control-center)$, blur on
layerrule = match:namespace ^(swaync-notification-window)$, blur on
layerrule = match:namespace ^(swaync-control-center)$, ignore_alpha 0.3
layerrule = match:namespace ^(swaync-notification-window)$, ignore_alpha 0.3

# >>> Metrics ERP (app Delphi sob Wine) — janelas flutuantes centralizadas
windowrule = match:class ^(metrics\.exe)$, float on
windowrule = match:class ^(metrics\.exe)$, center on
windowrule = match:class ^(metrics\.exe)$, rounding 10
# <<< Metrics ERP

# Rofi: liquid glass — blur no layer translúcido
layerrule = match:namespace ^(rofi)$, blur on
layerrule = match:namespace ^(rofi)$, ignore_alpha 0.3

# Vicinae (Spotlight): frost no vidro translúcido (opacity < 1 + liquid_glass)
layerrule = match:namespace ^(vicinae)$, blur on
layerrule = match:namespace ^(vicinae)$, ignore_alpha 0.3
# entrada suave (pop + fade) — o "bounce" do Spotlight ao abrir
layerrule = match:namespace ^(vicinae)$, animation popin 85%

# >>> OpenLogi Actions Ring
# O overlay lê o cursor só via X11 (openlogi-hook/src/linux.rs:145) e sob
# Wayland esse valor vem congelado; além disso um cliente Wayland não pode
# posicionar a própria janela, então o `WindowBounds` pedido em ring.rs:281 é
# ignorado e o ring encalha num canto.
# `move cursor -50% -50%` seria a saída natural, mas no 0.56.2 o modificador
# `cursor` passa na validação e é descartado em silêncio (medido: `move 400
# 400` posiciona; `move cursor 0 0` cai no centro do monitor). Quem
# posiciona é scripts/openlogi-ring-cursor.py, via evento openwindow.
windowrule = match:class ^(openlogi-action-ring)$, float on
windowrule = match:class ^(openlogi-action-ring)$, size 360 360
# NÃO usar `no_focus on` aqui: no Hyprland ela tira a janela da lógica de
# foco e os cliques atravessam para a janela de baixo — o ring fica inerte.
# A janela é transparente e quadrada (360x360): borda, sombra e blur desenham
# o retângulo inteiro em volta do anel.
windowrule = match:class ^(openlogi-action-ring)$, border_size 0
windowrule = match:class ^(openlogi-action-ring)$, rounding 0
windowrule = match:class ^(openlogi-action-ring)$, no_shadow on
windowrule = match:class ^(openlogi-action-ring)$, no_blur on
# no_anim: o script reposiciona logo após o mapa da janela; com animação de
# movimento ligada o anel apareceria no centro e deslizaria até o cursor.
windowrule = match:class ^(openlogi-action-ring)$, no_anim on
# <<< OpenLogi Actions Ring

# Quickshell (barra + launcher) — blur do compositor atrás das ilhas de vidro
layerrule = match:namespace ^(quickshell-bar)$, blur on
layerrule = match:namespace ^(quickshell-bar)$, ignore_alpha 0.20
layerrule = match:namespace ^(quickshell-launcher)$, blur on
layerrule = match:namespace ^(quickshell-launcher)$, ignore_alpha 0.30
layerrule = match:namespace ^(quickshell-launcher)$, xray off
