# ----------------------------------------------------- 
# Window rules
# ----------------------------------------------------- 

windowrule = match:class ^(blueman-manager)$, float on
windowrule = match:class ^(nm-connection-editor)$, float on
windowrule = match:class ^(qalculate-gtk)$, float on
windowrule = match:class ^(Blanket)$, float on
# Browser Picture in Picture
windowrule = match:title ^(Picture-in-Picture)$, float on, pin on, move 69.5% 4%

# Layers Config
# layerrule = blur, wofi
# layerrule = ignorezero, wofi
# layerrule = ignorealpha 0.5, wofi

# Sintaxe nova (Hyprland 0.55+): match:namespace + regra com valor.
# Waybar: frosted glass islands. ignore_alpha 0.20 => os vãos transparentes
# entre as ilhas (alpha 0) não borram; as ilhas (tint base >= 0.24) sim.
# Limiar baixado de 0.3 -> 0.20 porque o tint das ilhas ficou mais translúcido
# (mais wallpaper vívido através do vidro).
layerrule = match:namespace ^(waybar)$, blur on
layerrule = match:namespace ^(waybar)$, ignore_alpha 0.20

# swaync (notificações) com o mesmo tratamento de vidro
layerrule = match:namespace ^(swaync-control-center)$, blur on
layerrule = match:namespace ^(swaync-notification-window)$, blur on
layerrule = match:namespace ^(swaync-control-center)$, ignore_alpha 0.3
layerrule = match:namespace ^(swaync-notification-window)$, ignore_alpha 0.3

# >>> Metrics ERP (app Delphi sob Wine) — janelas flutuantes centralizadas
windowrule = match:class ^(metrics\.exe)$, float on
windowrule = match:class ^(metrics\.exe)$, center on
windowrule = match:class ^(metrics\.exe)$, rounding 10
# <<< Metrics ERP

# Rofi: liquid glass — blur no layer translúcido
layerrule = match:namespace ^(rofi)$, blur on
layerrule = match:namespace ^(rofi)$, ignore_alpha 0.3
