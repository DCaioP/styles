# -----------------------------------------------------
# General window decoration
# -----------------------------------------------------

decoration {
    rounding = 10
    blur {
        enabled = true
        size = 10
        passes = 4          # kernel menor (2^passes domina o alcance) -> evita cor do
                            # centro da tela "vazar" pra dentro da faixa da waybar
        noise = 0.05
        vibrancy = 0.18          # saturação do frost; baixo p/ não amplificar vazamento de cor (global)
        vibrancy_darkness = 0.15 # aprofunda os escuros do blur (global)
        new_optimizations = on
        ignore_opacity = true
        xray = true
        popups = true
    }
    active_opacity = 1.0
    inactive_opacity = 1.0
    fullscreen_opacity = 1.0
    shadow {
      enabled = true
      range = 20
      offset = -1, 1
      render_power = 10
      color = 0x66000000
    }
}
