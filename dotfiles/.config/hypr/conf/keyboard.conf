# -----------------------------------------------------
# Keyboard Layout
# -----------------------------------------------------

# Override /etc/environment GTK_IM_MODULE=cedilla.
# GTK4 nao tem modulo 'cedilla' -> dead keys quebram (Ghostty etc).
# 'simple' faz compose local via libxkbcommon lendo ~/.XCompose.
# ('wayland' nao serve sem um IME tipo ibus/fcitx rodando.)
env = GTK_IM_MODULE,simple

input {
    kb_layout = us
    kb_variant = intl
    kb_model = pc105
    numlock_by_default = true
    mouse_refocus = false
    
    follow_mouse = 1
    touchpad {
        # for mouse
        natural_scroll = false

        # for touchpad
        natural_scroll = true
        middle_button_emulation = true
        clickfinger_behavior = false
        disable_while_typing = true
        scroll_factor = 1
    }
    sensitivity = -0.1
}

