# =============================================================================
#  Hyprland · Liquid Glass — trechos relevantes
#  Copie estas linhas pros seus arquivos (decoration / windowrule / general) OU
#  `source = .../hyprland-glass.conf` se preferir manter separado.
#  Testado no Hyprland 0.55.4 (sintaxe de layerrule nova: match:namespace).
# =============================================================================

# -----------------------------------------------------------------------------
#  1) BLUR — o frost real do vidro sai daqui (o CSS do waybar só faz o tint/rim).
#     Kernel curto (passes baixo) evita que cor de elementos distantes "vaze"
#     pra dentro da faixa da barra — passes domina o ALCANCE (2^passes).
# -----------------------------------------------------------------------------
decoration {
    blur {
        enabled = true
        size = 10
        passes = 4               # alcance do blur; 3–4 = frost sem vazamento de cor
        noise = 0.05             # grão fosco (realismo de vidro)
        vibrancy = 0.18          # saturação do frost; baixo p/ não amplificar vazamento
        vibrancy_darkness = 0.15
        new_optimizations = on
        xray = true              # blur amostra o wallpaper, não o conteúdo das janelas
        ignore_opacity = true
        popups = true
    }
}

# -----------------------------------------------------------------------------
#  2) LAYERRULES — dá blur às ilhas do waybar e ignora os vãos transparentes.
#     ignore_alpha 0.20: pixels com alpha < 0.20 (os vãos entre ilhas) NÃO
#     borram; as ilhas (tint base >= 0.24) borram. Mantenha < alpha das ilhas.
# -----------------------------------------------------------------------------
layerrule = match:namespace ^(waybar)$, blur on
layerrule = match:namespace ^(waybar)$, ignore_alpha 0.20

# Mesmo tratamento de vidro pras notificações (swaync), se você usar:
layerrule = match:namespace ^(swaync-control-center)$, blur on
layerrule = match:namespace ^(swaync-notification-window)$, blur on
layerrule = match:namespace ^(swaync-control-center)$, ignore_alpha 0.20
layerrule = match:namespace ^(swaync-notification-window)$, ignore_alpha 0.20

# -----------------------------------------------------------------------------
#  3) GAPS — a barra flutua (waybar "exclusive": false, não reserva espaço).
#     Um gap_out SUPERIOR maior deixa as janelas logo abaixo da ilha flutuante,
#     com uma folga leve. Ordem: top, right, bottom, left.
#     Ajuste o 1º número: maior = mais respiro; menor = janela mais "consumida".
# -----------------------------------------------------------------------------
general {
    gaps_in  = 6
    gaps_out = 55, 14, 14, 14
}
